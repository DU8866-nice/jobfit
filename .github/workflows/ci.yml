name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Evaluation set (offline demo provider)
        run: python -m evals.run_evals

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jobfit .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name jobfit jobfit
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/api/health; then break; fi
            sleep 1
          done
          curl -fs http://localhost:8000/api/health | grep -q '"provider":"mock"'
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
          docker logs jobfit
