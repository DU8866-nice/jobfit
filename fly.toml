# Fly.io configuration. The deploy workflow (.github/workflows/deploy.yml) uses this file.
# Change `app` before the first deploy if the name is taken; it becomes https://<app>.fly.dev

app = "jobfit-jamesdu"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  JOBFIT_PROVIDER = "deepseek"
  JOBFIT_RATE_LIMIT_PER_HOUR = "10"
  JOBFIT_DAILY_ANALYSIS_LIMIT = "200"
  # Fly's proxy always sets this header to the visitor's IP, so it is safe to trust.
  JOBFIT_CLIENT_IP_HEADER = "Fly-Client-IP"

[http_service]
  internal_port = 8000
  force_https = true
  # Stop the machine when nobody is using the site and start it again on the next visit,
  # so an idle site costs almost nothing. Waking up takes a few seconds.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
