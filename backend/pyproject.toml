[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfit"
version = "0.1.0"
description = "AI job-application assistant: checks a resume against a job ad and only reports evidence it can verify."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "anthropic>=2.0,<3",
  "openai>=1.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "reportlab>=4",
]

[tool.setuptools.packages.find]
include = ["jobfit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
